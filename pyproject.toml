[project]
name = "ultrapubsub"
version = "0.1.0"
description = "Ultra-fast synchronous broadcast using shared memory"
authors = [
    {name = "ultrapubsub team"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.4",
    "psutil>=7.1.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "ultrapubsub.ultrapubsub"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.9.4",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ultrapubsub",
]

[tool.uv.sources]
ultrapubsub = { workspace = true }
